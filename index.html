<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stumpland</title>
    <style>
      :root {
        --ink: #d8d3c9;
        --dim: #8b857a;
        --edge: #3a3d3f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2b2f31;
        color: var(--ink);
        font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
      }
      #view { display: block; width: 100%; height: 100%; }
      #panel {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        height: 100%;
        padding: 20px 18px;
        overflow-y: auto;
        background: rgba(28, 31, 33, 0.82);
        border-right: 1px solid var(--edge);
      }
      #panel h1 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
      .weather { margin: 0 0 14px; color: var(--dim); font-style: italic; }
      .vitals, .stores { margin: 0 0 4px; color: var(--dim); }
      .actions { display: flex; flex-direction: column; gap: 2px; margin: 16px 0; }
      button {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 5px 8px;
        border: 1px solid transparent;
        border-radius: 2px;
        background: none;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
        white-space: nowrap;
      }
      button span { flex: 0 0 auto; }
      button:hover:not(:disabled) { border-color: var(--edge); background: rgba(255,255,255,0.04); }
      button:disabled { color: #5f5b54; cursor: default; }
      button span { color: var(--dim); font-size: 11px; }
      button:disabled span { color: #4e4a45; }
      .sleep { margin-top: 10px; border-color: var(--edge); }
      .log { margin-top: 20px; color: var(--dim); font-size: 12px; }
      /* The journal. Serif, quiet, the scene dimmed behind it. */
      #journal {
        position: fixed;
        inset: 0;
        display: none;
        padding: 7vh 0;
        overflow-y: auto;
        background: rgba(20, 22, 24, 0.9);
        backdrop-filter: blur(2px);
      }
      #journal.open { display: block; }
      #journal .page {
        max-width: 34rem;
        margin: 0 auto;
        padding: 0 2rem;
        font-family: Iowan Old Style, Palatino, Georgia, serif;
        color: #cfc8bb;
      }
      #journal h2 {
        margin: 0 0 2.4rem;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7d766a;
      }
      #journal .entry { margin: 0 0 2.2rem; }
      #journal .when {
        margin: 0 0 0.35rem;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: #7d766a;
      }
      #journal .text { margin: 0; font-size: 16px; line-height: 1.75; }
      #journal .empty { color: #7d766a; font-style: italic; }
      #journal .close {
        display: block;
        margin: 3rem auto 0;
        width: auto;
        color: #7d766a;
        font-family: inherit;
      }
      #hint {
        position: fixed;
        right: 14px;
        bottom: 12px;
        color: #5f5b54;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel"></div>
    <div id="journal"><div class="page" id="journal-page"></div></div>
    <div id="hint">drag to pan &middot; scroll to zoom &middot; R to swing round &middot; J for the journal</div>
    <script type="module" src="/src/renderer/main.ts"></script>
  </body>
</html>
